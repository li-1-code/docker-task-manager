services:
  api:
    build: .
    container_name: task-api
    environment:
      DATABASE_URL: postgresql+psycopg://taskuser:${POSTGRES_PASSWORD}@db:5432/taskdb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./tests:/code/tests
    depends_on:
      - redis

  db:
    image: postgres:16
    container_name: task-postgres
    volumes:
      - task-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskdb

  redis:
    image: redis:7-alpine
    container_name: task-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  task-postgres-data:
    external: true
